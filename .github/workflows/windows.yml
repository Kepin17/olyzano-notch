name: Windows

on:
  push:
    branches: [main, windows-port]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.7.0) from the chosen branch; empty = just build"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # attaches the files to a release
    env:
      QT_VERSION: "6.8.*"
    steps:
      - uses: actions/checkout@v4

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtimageformats # WebP and friends: "Convert to WebP" and thumbnails need them
          cache: true

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: OpenSSL (AES-GCM for encrypted shares)
        run: vcpkg install openssl:x64-windows

      - name: Configure
        # The Discord app for "muted / deafened" comes from repository secrets (Settings -> Secrets -> Actions:
        # DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET). Without them the build still works, minus that feature.
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DNOTCH_DISCORD_CLIENT_ID="$env:DISCORD_CLIENT_ID"
          -DNOTCH_DISCORD_CLIENT_SECRET="$env:DISCORD_CLIENT_SECRET"

      - name: Build
        run: cmake --build build -- -k 0 # keep going: one run shows every compile error

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          # QtTest's console output does not reach the log from here, so it goes to a file that is printed after.
          .\build\tst_core.exe -o "tst_core.txt,txt"
          $code = $LASTEXITCODE
          Get-Content tst_core.txt | Select-String -Pattern 'FAIL!|Loc:|Actual|Expected|Totals|QFATAL|SKIP' | ForEach-Object { $_.Line }
          "tst_core exit code: $code"
          if ($code -ne 0) { exit 1 }

      - name: Version
        id: ver
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(notch VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Collect the program and its libraries
        run: |
          New-Item -ItemType Directory deploy | Out-Null
          Copy-Item build\notch.exe deploy\
          windeployqt --release --qmldir src\qml --compiler-runtime deploy\notch.exe
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\libcrypto-3-x64.dll" deploy\
          Get-ChildItem deploy | Select-Object -First 40 | Format-Table Name, Length

      - name: Portable zip
        run: Compress-Archive -Path deploy\* -DestinationPath "Notch-${{ steps.ver.outputs.version }}-windows-x64-portable.zip"

      - name: Installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\deploy" packaging\windows\notch.iss

      - uses: actions/upload-artifact@v4
        with:
          name: notch-windows-x64
          path: |
            Notch-*-portable.zip
            installer/*.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # A run started by hand names its tag; the release then creates it on the commit that was built.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            Notch-*-portable.zip
            installer/*.exe
