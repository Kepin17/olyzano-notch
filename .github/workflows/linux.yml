name: Linux

on:
  push:
    branches: [main] # a build and the tests on every push; the release only on a tag
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.7.0) from the chosen branch; empty = just build"
        required: false
        default: ""

jobs:
  deb:
    runs-on: ubuntu-latest
    # Notch needs Qt 6.5+, and the runner's Ubuntu 24.04 ships 6.4: build on Debian 13 (Qt 6.8) instead.
    # A .deb built there also installs on newer Debian/Ubuntu releases with the same library names.
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates cmake ninja-build g++ dpkg-dev file \
            git libssl-dev qt6-base-dev qt6-base-private-dev qt6-declarative-dev \
            liblayershellqtinterface-dev libkf6windowsystem-dev libkf6idletime-dev \
            libqt6sql6-sqlite qt6-image-formats-plugins qml6-module-qtmultimedia libdbus-1-dev pkg-config # the tests open a database and write WebP

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: cd build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure

      - name: Package
        run: cd build && cpack

      - name: Checksums
        run: cd build && sha256sum notch_*.deb | tee ../SHA256SUMS-linux.txt

      - name: Sign the checksums
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.NOTCH_UPDATE_SIGNING_KEY }}
        run: |
          # The app installs an update by itself only if SHA256SUMS-<system>.txt carries a signature made with this key (see docs/RELEASING.md).
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::NOTCH_UPDATE_SIGNING_KEY is not set: this release is not signed, so the app will not update itself from it"
            exit 0
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/sign.pem"
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/sign.pem" -in SHA256SUMS-linux.txt | base64 -w0 > SHA256SUMS-linux.txt.sig
          rm -f "$RUNNER_TEMP/sign.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: notch-linux-deb
          path: build/notch_*.deb

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # A run started by hand names its tag; the release then creates it on the commit that was built.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            build/notch_*.deb
            SHA256SUMS-linux.txt
            SHA256SUMS-linux.txt.sig
