name: Linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.7.0) from the chosen branch; empty = just build"
        required: false
        default: ""

jobs:
  deb:
    runs-on: ubuntu-latest
    # Notch needs Qt 6.5+, and the runner's Ubuntu 24.04 ships 6.4: build on Debian 13 (Qt 6.8) instead.
    # A .deb built there also installs on newer Debian/Ubuntu releases with the same library names.
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates cmake ninja-build g++ dpkg-dev file \
            libssl-dev qt6-base-dev qt6-base-private-dev qt6-declarative-dev \
            liblayershellqtinterface-dev libkf6windowsystem-dev libkf6idletime-dev \
            libqt6sql6-sqlite qt6-image-formats-plugins # the tests open a database and write WebP

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: cd build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure

      - name: Package
        run: cd build && cpack

      - uses: actions/upload-artifact@v4
        with:
          name: notch-linux-deb
          path: build/notch_*.deb

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # A run started by hand names its tag; the release then creates it on the commit that was built.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: .github/RELEASE_NOTES.md
          files: build/notch_*.deb
