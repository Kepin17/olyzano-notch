<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Notch share</title>
<style>
  :root { color-scheme: light dark; --bg:#f3eee2; --fg:#1c1a17; --dim:#6b6355; --card:#e8e1d1; --line:#cdc2ab; --shu:#c8372d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14120f; --fg:#efe9dc; --dim:#9b917f; --card:#211e1a; --line:#3b352d; --shu:#d4493b; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, sans-serif; padding:16px; }
  main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:24px; text-align:center; }
  h1 { font:600 14px/1 serif; letter-spacing:.08em; margin:0 0 18px; color:var(--dim); }
  #name { font-weight:600; word-break:break-all; }
  #info { color:var(--dim); font-size:14px; margin:4px 0 18px; }
  button, input { font:inherit; border-radius:6px; padding:10px 16px; }
  button { background:var(--shu); color:#fff; border:0; width:100%; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  input { width:100%; margin-bottom:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); text-align:center; letter-spacing:.2em; }
  progress { width:100%; height:6px; margin-top:14px; }
  #msg { margin-top:14px; font-size:14px; color:var(--dim); min-height:1.4em; }
  .err { color:var(--shu) !important; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>NOTCH · 通知</h1>
  <div id="name">Shared file</div>
  <div id="info">Checking the link…</div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" hidden>
  <button id="go" disabled>Download</button>
  <progress id="bar" max="1" value="0" hidden></progress>
  <div id="msg"></div>
</main>
<script>
"use strict";
// Format (see ShareCrypto.h): "NSH1" | nonce prefix (8) | chunk size u32 | records;
// record = length u32 | AES-256-GCM ciphertext+tag. Record 0 is the JSON metadata.
// Nonce = prefix | record index u32; AAD = index u32 | final flag (1 on the last record).
const $ = id => document.getElementById(id);
const id = location.pathname.split("/")[2];
const WARN_BYTES = 300 * 1024 * 1024;
let meta = null, key = null;

function say(text, bad) { $("msg").textContent = text; $("msg").className = bad ? "err" : ""; }
function size(n) { const u = ["B","KiB","MiB","GiB"]; let i = 0; while (n >= 1024 && i < 3) { n /= 1024; i++; } return n.toFixed(i ? 1 : 0) + " " + u[i]; }
function b64url(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function init() {
  const raw = location.hash.slice(1);
  if (!raw) { $("info").textContent = "This link is incomplete: the key after # is missing."; return; }
  try { key = await crypto.subtle.importKey("raw", b64url(raw), "AES-GCM", false, ["decrypt"]); }
  catch (e) { $("info").textContent = "This link is damaged. Ask for a new one."; return; }
  const r = await fetch("/s/" + id + "/meta");
  if (!r.ok) { $("info").textContent = "This link has expired or was already used."; return; }
  meta = await r.json();
  $("info").textContent = size(meta.size) + " · encrypted";
  $("pin").hidden = !meta.pin_required;
  $("go").disabled = false;
}

async function decrypt(buf) {
  const v = new DataView(buf), bytes = new Uint8Array(buf);
  if (buf.byteLength < 16 || String.fromCharCode(...bytes.slice(0, 4)) !== "NSH1") throw new Error("format");
  const prefix = bytes.slice(4, 12);
  let off = 16, index = 0, name = "download", type = "application/octet-stream";
  const parts = [];
  while (off < buf.byteLength) {
    const len = v.getUint32(off); off += 4;
    const ct = bytes.subarray(off, off + len); off += len;
    const iv = new Uint8Array(12); iv.set(prefix); new DataView(iv.buffer).setUint32(8, index);
    const aad = new Uint8Array(5); new DataView(aad.buffer).setUint32(0, index); aad[4] = off === buf.byteLength ? 1 : 0;
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv, additionalData: aad }, key, ct);
    if (index === 0) { const m = JSON.parse(new TextDecoder().decode(plain)); name = m.name || name; type = m.type || type; }
    else parts.push(plain);
    index++;
  }
  return { name, blob: new Blob(parts, { type }) };
}

$("go").onclick = async () => {
  if (meta.size > WARN_BYTES && !confirm("This file is large (" + size(meta.size) + ") and is held in memory while decrypting. Continue?")) return;
  $("go").disabled = true; $("bar").hidden = false; $("bar").value = 0; say("Downloading…");
  try {
    const r = await fetch("/s/" + id + "/blob", { headers: { "X-Pin": $("pin").value } });
    if (r.status === 403) { say("Wrong PIN.", true); $("go").disabled = false; return; }
    if (r.status === 429) { say("Too many tries. Wait a few minutes.", true); $("go").disabled = false; return; }
    if (!r.ok) { say("This link has expired or was already used.", true); return; }
    const total = meta.size, buf = new Uint8Array(total); let got = 0;
    const reader = r.body.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf.set(value, got); got += value.length; $("bar").value = got / total;
    }
    say("Decrypting…");
    const { name, blob } = await decrypt(buf.buffer);
    $("name").textContent = name;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    say("Done. The file was saved as " + name + ".");
    $("bar").hidden = true;
  } catch (e) {
    say("Could not decrypt the file. The link may be incomplete or corrupted.", true);
    $("bar").hidden = true;
  }
};
addEventListener("hashchange", () => location.reload()); // a pasted-over key must be re-read
init();
</script>
</body>
</html>
